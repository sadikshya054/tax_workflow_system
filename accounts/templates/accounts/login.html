<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Page title shown in the browser tab. -->
<title>Login | Tax Workflow System</title>

<!-- Loads the stylesheet for the login page. -->
{% load static %}
<link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">

</head>

<body>

<main class="login-page">

    <!-- Main login card. -->
    <section class="login-card">

        <div class="login-header">
            <h1>Tax Workflow System</h1>
            <p>Secure Client and Staff Portal</p>
        </div>

        <div class="login-content">
            <h2>Welcome Back</h2>
            <p class="login-subtitle">
                Sign in to access your account.
            </p>

            <!-- Displays an error when login credentials are incorrect. -->
            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <!-- Django securely processes the login request. -->
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Sign In
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p>Secure access for authorised users only.</p>
        </div>

    </section>

</main>

</body>
</html>
